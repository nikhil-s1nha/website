<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Nikhil Sinha</title>
<meta name="description" content="Curriculum vitae of Nikhil Sinha.">
<!-- unlisted: not linked from anywhere on the site, and kept out of search results -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* The sheet below carries the name already, so the header is just the two
     controls sharing one line. */
  .cv-header {
    margin-bottom: 1.6rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .cv-download {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--text-faint);
    border: 1px solid var(--rule);
    padding: 0.45rem 0.9rem;
    white-space: nowrap;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .cv-download:hover { color: var(--text); border-color: var(--text-faint); }

  /* The document itself: the PDF rendered to canvas, so the LaTeX typesetting
     is preserved exactly. Pages are painted by pdf.js at device resolution and
     re-painted on resize, which keeps the type crisp instead of upscaling a
     bitmap. Sheets sit on the site's grey like paper on a desk. */
  .cv-doc { display: flex; flex-direction: column; gap: 1.5rem; }
  .cv-sheet {
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.10), 0 8px 28px rgba(0,0,0,0.08);
    width: 100%;
    overflow: hidden;
  }
  .cv-sheet canvas { display: block; width: 100%; height: auto; }

  .cv-status {
    padding: 3rem 1.5rem;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 300;
    color: var(--text-faint);
  }
  .cv-status a { color: var(--text); text-underline-offset: 0.18em; }

  .cv-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .cv-footer a { color: var(--text-faint); text-decoration: none; transition: color 0.3s ease; }
  .cv-footer a:hover { color: var(--text); }

  /* Printing the page should print the CV, not a screenshot of the site. */
  @media print {
    body { background: #fff; }
    .page { padding: 0; max-width: none; }
    .cv-header, .cv-footer { display: none; }
    .cv-doc { gap: 0; }
    .cv-sheet { box-shadow: none; }
  }
</style>
</head>
<body>
  <script>
    // Marks this browser as having seen the CV, so the homepage nav can quietly
    // offer a way back in. Never written to the page's own HTML - only a browser
    // that actually opened this link ever gets the flag, so it stays out of the
    // static markup a random visitor or crawler would see.
    try { localStorage.setItem('ns-cv-seen', '1'); } catch (e) {}
  </script>
  <div class="page">
    <header class="cv-header">
      <a href="/" class="back-link">&larr; Back</a>
      <a href="/cv/Nikhil-Sinha-Resume.pdf" class="cv-download" download>Download PDF</a>
    </header>

    <div class="cv-doc" id="doc">
      <p class="cv-status" id="status">Loading&hellip;</p>
      <noscript>
        <p class="cv-status">
          This page renders the CV inline with JavaScript.
          <a href="/cv/Nikhil-Sinha-Resume.pdf">Open the PDF directly.</a>
        </p>
      </noscript>
    </div>

    <footer class="cv-footer">
      <a href="/">&larr; Back to home</a>
      <a href="/cv/Nikhil-Sinha-Resume.pdf" download>Download PDF</a>
    </footer>
  </div>

  <script type="module">
    const PDF = '/cv/Nikhil-Sinha-Resume.pdf';
    const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38';
    const doc = document.getElementById('doc');
    const status = document.getElementById('status');

    /* If pdf.js can't load or render, fall back to the browser's own PDF viewer
       rather than leaving a blank page. */
    function fallback() {
      doc.innerHTML =
        '<object class="cv-sheet" data="' + PDF + '" type="application/pdf" style="height:80vh">' +
          '<p class="cv-status">Your browser can\'t display the CV inline. ' +
          '<a href="' + PDF + '">Open the PDF</a>.</p>' +
        '</object>';
    }

    try {
      const pdfjs = await import(CDN + '/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = CDN + '/pdf.worker.min.mjs';

      const pdf = await pdfjs.getDocument(PDF).promise;
      status.remove();

      // one sheet per page, so a two-page CV works without changing anything here
      const sheets = [];
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const sheet = document.createElement('div');
        sheet.className = 'cv-sheet';
        sheet.style.aspectRatio = base.width + ' / ' + base.height;  // reserve space before paint
        const canvas = document.createElement('canvas');
        sheet.appendChild(canvas);
        doc.appendChild(sheet);
        sheets.push({ page, base, sheet, canvas, task: null });
      }

      function paint() {
        for (const s of sheets) {
          const cssWidth = s.sheet.clientWidth;
          if (!cssWidth) continue;
          // cap DPR so a 3x phone screen doesn't allocate a needlessly huge canvas
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const viewport = s.page.getViewport({ scale: (cssWidth / s.base.width) * dpr });

          if (s.task) s.task.cancel();          // drop an in-flight paint from a previous size
          s.canvas.width = Math.floor(viewport.width);
          s.canvas.height = Math.floor(viewport.height);
          s.task = s.page.render({ canvasContext: s.canvas.getContext('2d'), viewport });
          s.task.promise.catch(() => {});       // cancellation rejects; not an error
        }
      }

      paint();

      // repaint at the new width, but only once the resize settles
      let t;
      let last = window.innerWidth;
      addEventListener('resize', () => {
        if (window.innerWidth === last) return;  // ignore mobile URL-bar height changes
        last = window.innerWidth;
        clearTimeout(t);
        t = setTimeout(paint, 180);
      });
    } catch (err) {
      console.error('inline CV render failed:', err);
      fallback();
    }
  </script>
</body>
</html>
